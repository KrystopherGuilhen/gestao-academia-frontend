<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420">
  <!-- fundo circular suave -->
  <circle cx="250" cy="210" r="190" fill="#EEF2FF"/>
  <circle cx="250" cy="210" r="150" fill="#E0E7FF"/>

  <!-- decoracao: estrelas/pontos flutuantes -->
  <circle cx="90" cy="100" r="6" fill="#FBBF24"/>
  <circle cx="420" cy="130" r="8" fill="#34D399"/>
  <circle cx="410" cy="320" r="5" fill="#F472B6"/>
  <circle cx="80" cy="310" r="7" fill="#60A5FA"/>

  <!-- pilha de livros -->
  <g>
    <rect x="150" y="290" width="200" height="26" rx="4" fill="#4338CA"/>
    <rect x="160" y="264" width="180" height="26" rx="4" fill="#6366F1"/>
    <rect x="145" y="238" width="210" height="26" rx="4" fill="#818CF8"/>
  </g>

  <!-- diploma (rolo) apoiado ao lado dos livros -->
  <g>
    <rect x="330" y="200" width="18" height="90" rx="9" fill="#FBBF24"/>
    <rect x="352" y="200" width="18" height="90" rx="9" fill="#F59E0B"/>
    <rect x="330" y="195" width="40" height="14" rx="7" fill="#D97706"/>
    <rect x="330" y="276" width="40" height="14" rx="7" fill="#D97706"/>
  </g>

  <!-- chapeu de formatura -->
  <g>
    <polygon points="250,120 340,158 250,196 160,158" fill="#312E81"/>
    <polygon points="250,196 300,176 300,205 250,224" fill="#1E1B4B"/>
    <rect x="244" y="150" width="12" height="12" rx="2" fill="#1E1B4B"/>
    <!-- borla -->
    <line x1="250" y1="158" x2="300" y2="185" stroke="#FBBF24" stroke-width="3"/>
    <circle cx="300" cy="185" r="6" fill="#FBBF24"/>
    <path d="M296 191 q4 14 8 0" stroke="#FBBF24" stroke-width="3" fill="none"/>
  </g>

  <!-- base/sombra -->
  <ellipse cx="250" cy="330" rx="140" ry="14" fill="#C7D2FE" opacity="0.6"/>
</svg>
